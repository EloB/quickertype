[package]
name = "quicktype-core"
description = "The quicktype engine: infer types from JSON, JSON Schema and GraphQL and render them in 25+ languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["fs"]
# `StdIo`: reading schemas and inputs from the file system and stdin.
fs = []
# HTTP(S) URLs for `StdIo` (ureq with rustls), as the native CLI needs.
http = ["fs", "dep:ureq"]

[dependencies]
indexmap.workspace = true
quicktype-js-compat.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
