<text x="20" y="35" font-size="15" font-weight="600" fill="#1b1c24">Peak memory, generated JSON (40 MB)</text>
<text x="20" y="53.5" font-size="12.5" fill="#5f6271">quickertype's CLI uses 10× less than quicktype's</text>
<text x="20" y="85.5" font-size="13.5" fill="#1b1c24">quicktype</text>
<path d="M20 92.5H428.29A4 4 0 0 1 432.29 96.5V100.5A4 4 0 0 1 428.29 104.5H20Z" fill="#8a8c99"/>
