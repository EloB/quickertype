# Every hash map and set uses the seeded hasher of quicktype_js_compat::hash
# (quickertype-core's support::fast_hash): their keys come from the input,
# and in WebAssembly `std`'s RandomState has the same keys in every
# instance, so crafted keys could make inference quadratic. That module is
# the one place that names these types (with an `allow` and a comment).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "use quicktype_js_compat::hash::HashMap (core: support::fast_hash), which is seeded per instance in WebAssembly" },
    { path = "std::collections::HashSet", reason = "use quicktype_js_compat::hash::HashSet (core: support::fast_hash), which is seeded per instance in WebAssembly" },
    { path = "std::hash::RandomState", reason = "fixed in WebAssembly: use quicktype_js_compat::hash::SeededState" },
    { path = "std::hash::DefaultHasher", reason = "SipHash with fixed keys: use quicktype_js_compat::hash::SeededState" },
    { path = "indexmap::IndexMap", reason = "use quicktype_js_compat::hash::IndexMap (core: support::fast_hash), with the seeded hasher" },
    { path = "indexmap::IndexSet", reason = "use quicktype_js_compat::hash::IndexSet (core: support::fast_hash), with the seeded hasher" },
    { path = "foldhash::fast::RandomState", reason = "use quicktype_js_compat::hash::SeededState, which is seeded per instance in WebAssembly" },
    { path = "foldhash::fast::FixedState", reason = "a fixed seed: use quicktype_js_compat::hash::SeededState" },
]
