[package]
name = "quicktype-wasm"
description = "WebAssembly bindings exposing the quicktype-core JavaScript API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.dist]
# Not released: npm/quicktype-core builds it (docs/RELEASING.md).
dist = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indexmap.workspace = true
js-sys.workspace = true
quickertype-core = { workspace = true, default-features = false }
quickertype-js-compat = { workspace = true, features = ["js-host-math"] }
wasm-bindgen.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
# The allocator counts the bytes in use and their peak (`__heapBytes`,
# `__heapPeak`), for measuring what an operation needs: about 2% of a
# run's time, so release builds leave it out
# (`node npm/quicktype-core/script/build.mjs --heap-stats` turns it on).
heap-stats = []

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: the global allocator (src/allocator.rs) is the one place that
# needs it, and allows it there.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Deferred in the workspace too (see its [workspace.lints.clippy]).
collapsible_if = "allow"
manual_is_multiple_of = "allow"
