<svg xmlns="http://www.w3.org/2000/svg" width="520" height="177" viewBox="0 0 520 177" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Peak memory, generated JSON (40 MB)</title>
<desc id="desc">quickertype's CLI uses 10× less than quicktype's. quicktype: 625 MiB; quickertype: 62 MiB.</desc>
