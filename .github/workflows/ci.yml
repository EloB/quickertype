name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # tests/golden: quicktype's output for every test case, generated from
  # quicktype at the commit in tests/golden/REFERENCE and not in git
  # (docs/ARCHITECTURE.md, "The golden corpus"). Restored from Turborepo's
  # cache unless what it depends on changed (.github/actions/golden), and
  # handed to the jobs that compare with it as an artifact.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Turborepo alone (the root's devDependencies), not the workspaces'.
      - run: npm ci --workspaces=false
      # Every task in the turbo.json files resolves (a dry run plans them
      # all).
      - run: npx turbo run build lint test test:differential parity --dry=json > /dev/null
      - uses: ./.github/actions/golden
        with:
          mode: share

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The `trace` feature (docs/BENCHMARKS.md), off in every other build:
      # its spans, `__trace` and the `phases` example.
      - run: cargo clippy -p quickertype-core -p quicktype-wasm --all-targets --features quickertype-core/trace,quicktype-wasm/trace
      # The `siphash` feature (quickertype-js-compat's `hash`): every map
      # with std's SipHash natively instead of foldhash.
      - run: cargo clippy --workspace --all-targets --features quickertype-core/siphash

  test:
    needs: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # tests/golden, from the golden job.
      - uses: ./.github/actions/golden
        with:
          mode: download
      - run: cargo test --workspace
      - run: cargo test -p quickertype-core -p quicktype-wasm --lib --features quickertype-core/trace,quicktype-wasm/trace
      # With `siphash`: the same output with std's SipHash in every map.
      - run: cargo test -p quickertype-js-compat -p quickertype-core --features quickertype-core/siphash

  # The CLI and the tests on the other platforms the release builds for
  # (docs/RELEASING.md). The parity corpus runs on Linux only (`parity`).
  # The CLI's integration tests build the binary themselves
  # (`CARGO_BIN_EXE_quickertype`).
  test-platforms:
    name: test (${{ matrix.os }})
    needs: golden
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # tests/golden, from the golden job.
      - uses: ./.github/actions/golden
        with:
          mode: download
      - run: cargo test --workspace --no-fail-fast

  # .github/workflows/release.yml and crates/quicktype-cli/wix/main.wxs are
  # generated by dist from dist-workspace.toml (main.wxs with one line of
  # ours): fail if they are out of date (run `dist generate`). Uses the dist
  # version the config pins.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Install dist
        shell: bash
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          test -n "$version"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - run: dist generate --check
      # main.wxs is dist's rendering plus the line that adds the bundled
      # files, the TypeScript compiler and the notices (allow-dirty in
      # dist-workspace.toml, so the check above skips it): without that
      # line, it must still be what dist renders.
      - name: Check main.wxs against dist's rendering
        run: |
          sed -i '/^allow-dirty = \["msi"\]$/d' dist-workspace.toml
          sed -i "/<ComponentGroupRef Id='BundledFiles'\/>/d" crates/quicktype-cli/wix/main.wxs
          dist generate --mode msi --check
          git checkout -- dist-workspace.toml crates/quicktype-cli/wix/main.wxs
      - run: dist plan

  # The release archives bundle the TypeScript compiler (docs/RELEASING.md).
  # This builds the archive for this runner's target the way release.yml
  # does (the build setup's action, then `dist build`; without LTO, which
  # does not change what is packaged), then release/check-bundle.mjs checks
  # it as the release gate does and runs its quickertype on a TypeScript
  # file with no other compiler around, in the archive's and Homebrew's
  # layouts.
  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: Install dist
        shell: bash
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          test -n "$version"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      # What release.yml's build setup runs (.github/build-setup.yml); it
      # also sets up the Node.js the checks below use.
      - uses: ./.github/actions/stage-typescript
        with:
          targets: x86_64-unknown-linux-gnu
      - run: dist build --artifacts=local --target=x86_64-unknown-linux-gnu
        env:
          CARGO_PROFILE_DIST_LTO: "false"
          CARGO_PROFILE_DIST_CODEGEN_UNITS: "16"
      # The release gate's checks of the archive, then the conversions.
      - run: node release/check-bundle.mjs target/distrib/quickertype-x86_64-unknown-linux-gnu.tar.xz

  # Byte-for-byte parity with the TypeScript quicktype. Fails only if a case
  # listed in tests/parity-baseline.txt regresses.
  parity:
    needs: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # tests/golden, from the golden job.
      - uses: ./.github/actions/golden
        with:
          mode: download
      - run: cargo xtask parity --report parity-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: parity-report.json

  # TypeScript input against what quicktype-typescript-input (TypeScript
  # 5.9) recorded. Needs the TypeScript 7.0.2 native compiler; without it
  # the test would skip itself, so the version is checked first.
  typescript-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the TypeScript 7.0.2 compiler
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/tsc" typescript@7.0.2
          tsc="$RUNNER_TEMP/tsc/node_modules/@typescript/typescript-linux-x64/lib/tsc"
          "$tsc" --version
          "$tsc" --version | grep -q "7\.0\.2"
          echo "QUICKTYPE_TSC=$tsc" >> "$GITHUB_ENV"
      # The differential test, and the unit tests that need the compiler
      # (the round-trip count among them).
      - run: cargo test -p quickertype-typescript-input --lib --test differential

  # Secrets in the whole history (configuration: .gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package quicktype-wasm --target wasm32-unknown-unknown --release
      - run: cargo build --package quicktype-wasm --target wasm32-unknown-unknown --release --features trace
      # Every target of the engine's crate (its tests and the `phases`
      # example too) as WebAssembly, with and without `trace`.
      - run: cargo clippy --package quicktype-wasm --target wasm32-unknown-unknown --all-targets
      - run: cargo clippy --package quicktype-wasm --target wasm32-unknown-unknown --all-targets --features trace
      # The tests' own engine (npm/quicktype-core/script/test-hooks.mjs).
      - run: cargo clippy --package quicktype-wasm --target wasm32-unknown-unknown --all-targets --features test-hooks

  # npm/quicktype-core: the WebAssembly engine behind quicktype's own
  # TypeScript API. Without a quicktype checkout, the differential suite
  # compares the engine with the package's own (vendored, unmodified)
  # TypeScript engine.
  npm:
    needs: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.114
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The repository's npm workspace (package.json), the package's
      # dependencies with it.
      - run: npm ci
      # tests/golden, from the golden job.
      - uses: ./.github/actions/golden
        with:
          mode: download
      - run: npm run build -w quickertype-core
      - run: npm test -w quickertype-core
      - run: npm run test:differential -w quickertype-core -- --report differential-report.json
        env:
          QUICKTYPE_REFERENCE: self
      - run: npm run test:browser -w quickertype-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-report
          path: npm/quicktype-core/differential-report.json

