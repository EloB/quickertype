# Secret scanning with gitleaks (https://github.com/gitleaks/gitleaks):
#   gitleaks git .     # the whole history
#   gitleaks dir .     # the working tree
#
# The allowlisted paths are test data: quicktype's own public test inputs
# (copied verbatim; they include long-expired URLs with tokens), the
# recorded golden outputs generated from them, and test vectors derived
# from both. Everything else is scanned with the default rules.

[extend]
useDefault = true

[[allowlists]]
description = "quicktype's public test data and vectors derived from it"
paths = [
  '''^tests/inputs/''',
  '''^tests/golden/''',
  '''^crates/[^/]+/tests/vectors/''',
]
