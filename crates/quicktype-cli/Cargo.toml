[package]
name = "quickertype"
description = "Rust port of quicktype: generate types and converters from JSON and schemas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["quicktype", "json", "json-schema", "graphql", "codegen"]
categories = ["command-line-utilities", "development-tools", "encoding"]
include = ["/src/", "/LICENSE", "/NOTICE"]

# Release packaging (docs/RELEASING.md). dist names the archives and
# installers after this package, and every installer installs the binary
# below. It is `quickertype`, not `quicktype`, so that it installs beside
# Homebrew core's and npm's `quicktype` (until 0.1.0 it was `quicktype`).
[package.metadata.dist]
# The Homebrew formula in EloB/homebrew-tap (`brew install EloB/tap/quickertype`).
formula = "quickertype"
# The npm installer package (`npm install -g quickertype`); never `quicktype`,
# which is the real quicktype's.
npm-package = "quickertype"

# The MSI (generated by dist into wix/main.wxs). The GUIDs identify the
# product across versions: never change them (an MSI with the same
# upgrade GUID replaces an older version's install).
[package.metadata.wix]
upgrade-guid = "B09D4B90-212F-4325-89B4-DCF68953A6F0"
path-guid = "F3BF10AB-6E3C-417D-A130-CABF58472F42"
license = false
eula = false

[[bin]]
name = "quickertype"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# Use mimalloc as the global allocator: quicktype allocates many small,
# short-lived objects, and mimalloc is markedly faster at that than the
# system allocators (see docs/BENCHMARKS.md). Output does not depend on it.
mimalloc = ["dep:mimalloc"]

[dependencies]
indexmap.workspace = true
mimalloc = { workspace = true, optional = true }
quickertype-core = { workspace = true, features = ["http"] }
quickertype-graphql-input.workspace = true
quickertype-js-compat.workspace = true
quickertype-typescript-input.workspace = true

[dev-dependencies]
serde_json.workspace = true

# `cargo bench -p quickertype --bench in_process`: the engine's in-process
# throughput, with the CLI's allocator (`--no-default-features` for the
# system allocator). See docs/BENCHMARKS.md.
[[bench]]
name = "in_process"
harness = false

[lints]
workspace = true
