[package]
name = "quicktype-wasm"
description = "WebAssembly bindings exposing the quicktype-core JavaScript API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indexmap.workspace = true
js-sys.workspace = true
quicktype-core = { workspace = true, default-features = false }
quicktype-js-compat = { workspace = true, features = ["js-host-math"] }
wasm-bindgen.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: the global allocator (src/allocator.rs) is the one place that
# needs it, and allows it there.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
