[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "24.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/glideapps/quicktype"
authors = ["quicktype contributors"]

# Shared dependency versions. Several exist specifically to reproduce
# JavaScript semantics byte-for-byte; see docs/PARITY.md before adding one.
[workspace.dependencies]
quicktype-core = { path = "crates/quicktype-core" }
quicktype-graphql-input = { path = "crates/quicktype-graphql-input" }
quicktype-js-compat = { path = "crates/quicktype-js-compat" }
quicktype-typescript-input = { path = "crates/quicktype-typescript-input" }
indexmap = "2"
regex = "1"
# The engine under `regex`, used directly for multi-pattern searches.
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "syntax"] }
ryu = "1"
saphyr-parser = "0.3.4"
stacker = "0.1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# `cargo build --profile profiling`: the release build with symbols, for
# profilers (samply, Instruments, perf). See docs/BENCHMARKS.md.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
