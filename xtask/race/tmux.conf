# tmux setup for the race recording; record.sh starts tmux with it, in a
# working directory that holds cards.json and bin/ (measure, quicktype and
# quickertype).
#
# Two side-by-side panes with titles and no status bar. Each pane runs a
# bash without rc files in an empty environment: prompt "$ ", PATH = bin/
# plus the system directories, so nothing local shows up on screen.
# Keys typed go to both panes (synchronize-panes); the tape uses three
# bindings for what must differ:
#   C-e, C-r  type "e" or "r" in the right pane only (quick|er|type)
#   C-x       stop synchronizing, so what follows goes to the left pane only

set -g status off
set -g escape-time 0
set -g default-terminal screen-256color
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=brightblack
set -g pane-border-format "#[fg=white,bold] #{@label} "
set -g default-command 'exec env -i HOME="$PWD" PATH="$PWD/bin:/usr/bin:/bin:/usr/sbin:/sbin" TERM=screen-256color LANG=en_US.UTF-8 BASH_SILENCE_DEPRECATION_WARNING=1 HISTFILE=/dev/null PS1="\$ " PS2="  " /bin/bash --noprofile --norc'

bind -n C-e { set -w synchronize-panes off ; send-keys -t race:0.1 e ; set -w synchronize-panes on }
bind -n C-r { set -w synchronize-panes off ; send-keys -t race:0.1 r ; set -w synchronize-panes on }
bind -n C-x set -w synchronize-panes off

new-session -d -s race
set -p -t race:0.0 @label "quicktype · TypeScript on Node.js"
split-window -h -t race:0
set -p -t race:0.1 @label "quickertype · Rust"
select-pane -t race:0.0
set -w -t race:0 synchronize-panes on
