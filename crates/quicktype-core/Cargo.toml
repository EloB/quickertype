[package]
name = "quickertype-core"
description = "The quicktype engine: infer types from JSON, JSON Schema and GraphQL and render them in 25+ languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["quicktype", "json", "json-schema", "codegen", "types"]
categories = ["development-tools", "encoding", "compilers"]
include = ["/src/", "/build.rs", "/LICENSE", "/NOTICE"]

[package.metadata.dist]
# dist builds installers for the `quickertype` CLI only; this crate is
# published to crates.io by .github/workflows/publish-crates.yml.
dist = false

[lib]
name = "quicktype_core"

[features]
default = ["fs"]
# Test hooks of reading on several threads (a fault to inject, counts of
# how samples were read), for this crate's tests and the differential
# harness: not in a normal build.
test-support = []
# `StdIo`: reading schemas and inputs from the file system and stdin.
fs = []
# HTTP(S) URLs for `StdIo` (ureq with rustls), as the native CLI needs.
http = ["fs", "dep:ureq", "dep:url", "dep:flate2", "dep:brotli-decompressor"]
# Records where a run's time goes (`trace`), for measurements; off in
# every build that ships.
trace = []
# On wasm32, seed every hash map and set from the JavaScript host's
# `crypto.getRandomValues` (`support::fast_hash`, which is
# quickertype-js-compat's `hash`), as the `quicktype-wasm` bindings do.
# Needs a JavaScript host with wasm-bindgen glue, which must call
# `support::fast_hash::init()` when it starts and handle its error.
# Without the feature, a wasm32 build seeds its maps from `std`'s
# `RandomState` (fixed on wasm32-unknown-unknown, which has no randomness
# of its own) unless the embedder calls `support::fast_hash::seed` first.
js-host-random = ["quickertype-js-compat/js-host-random"]
# Natively, every hash map and set with `std`'s SipHash-1-3 instead of
# foldhash (quickertype-js-compat's `siphash`): for an embedder that
# hashes untrusted input on a server. Slower; the output is the same.
siphash = ["quickertype-js-compat/siphash"]

[dependencies]
hashbrown.workspace = true
indexmap.workspace = true
quickertype-js-compat.workspace = true
regex.workspace = true
stacker.workspace = true
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
brotli-decompressor = { workspace = true, optional = true }

[dev-dependencies]
flate2.workspace = true
# This crate with its test hooks, for its integration tests.
quickertype-core = { path = ".", features = ["test-support"] }
# `preserve_order`: the differential tests rebuild type graphs from fixture
# dumps whose attribute objects list the attributes in JavaScript `Map`
# order, which the JSON Schema output depends on. Only the tests read
# fixtures with serde_json; the library does not use it.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
