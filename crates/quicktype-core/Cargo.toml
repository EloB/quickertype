[package]
name = "quickertype-core"
description = "The quicktype engine: infer types from JSON, JSON Schema and GraphQL and render them in 25+ languages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["quicktype", "json", "json-schema", "codegen", "types"]
categories = ["development-tools", "encoding", "compilers"]
include = ["/src/", "/build.rs", "/LICENSE", "/NOTICE"]

[package.metadata.dist]
# dist builds installers for the `quickertype` CLI only; this crate is
# published to crates.io by .github/workflows/publish-crates.yml.
dist = false

[lib]
name = "quicktype_core"

[features]
default = ["fs"]
# `StdIo`: reading schemas and inputs from the file system and stdin.
fs = []
# HTTP(S) URLs for `StdIo` (ureq with rustls), as the native CLI needs.
http = ["fs", "dep:ureq", "dep:url", "dep:flate2", "dep:brotli-decompressor"]
# Records where a run's time goes (`trace`), for measurements; off in
# every build that ships.
trace = []
# On wasm32, seed the hash maps from the JavaScript host's
# `crypto.getRandomValues` (`support::fast_hash`), as the `quicktype-wasm`
# bindings do. Needs a JavaScript host with wasm-bindgen glue. Without it,
# a wasm32 build's maps all share one fixed seed: WebAssembly has no
# randomness of its own.
js-host-random = ["dep:wasm-bindgen"]

[dependencies]
foldhash.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
quickertype-js-compat.workspace = true
regex.workspace = true
stacker.workspace = true
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
brotli-decompressor = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
flate2.workspace = true
# `preserve_order`: the differential tests rebuild type graphs from fixture
# dumps whose attribute objects list the attributes in JavaScript `Map`
# order, which the JSON Schema output depends on. Only the tests read
# fixtures with serde_json; the library does not use it.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
