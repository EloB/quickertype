[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

# The port's own version (semver), independent of quicktype's. The CLI
# reports quicktype's version for parity instead (`QUICKTYPE_VERSION` in
# crates/quicktype-cli/src/main.rs); see docs/RELEASING.md.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/EloB/quickertype"
homepage = "https://github.com/EloB/quickertype"
readme = "README.md"
authors = ["quicktype contributors"]

# Shared dependency versions. Several exist specifically to reproduce
# JavaScript semantics byte-for-byte; see docs/PARITY.md before adding one.
[workspace.dependencies]
# The workspace's own crates, published to crates.io as quickertype-*
# (docs/RELEASING.md). Their library names stay quicktype_*. `version`
# must equal the workspace version above.
quickertype-core = { path = "crates/quicktype-core", version = "0.1.0" }
quickertype-graphql-input = { path = "crates/quicktype-graphql-input", version = "0.1.0" }
quickertype-js-compat = { path = "crates/quicktype-js-compat", version = "0.1.0" }
quickertype-typescript-input = { path = "crates/quicktype-typescript-input", version = "0.1.0" }
foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false }
indexmap = "2"
mimalloc = { version = "0.1", default-features = false }
regex = "1"
# The engine under `regex`, used directly for multi-pattern searches.
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "syntax"] }
ryu = "1"
saphyr-parser = "0.3.4"
stacker = "0.1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "5.0"
# The WebAssembly bindings. `wasm-bindgen` must match the version of the
# `wasm-bindgen` CLI that generates the JavaScript glue (npm/quicktype-core).
js-sys = "=0.3.91"
wasm-bindgen = "=0.2.114"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# `cargo build --profile profiling`: the release build with symbols, for
# profilers (samply, Instruments, perf). See docs/BENCHMARKS.md.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# The profile that dist (docs/RELEASING.md) builds release artifacts with:
# exactly the release profile, so a released binary is the one
# `cargo build --release` makes and parity tests.
[profile.dist]
inherits = "release"
