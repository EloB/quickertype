# Publishes npm/quicktype-core to npm as `quickertype-core`, quicktype's
# JavaScript API on the WebAssembly engine (docs/RELEASING.md).
#
# - Release: release.yml calls it (dist's custom publish job
#   "./publish-npm-core" in dist-workspace.toml) after the GitHub Release is
#   created, on the release tag's commit. It builds the package, runs its
#   tests and publishes with provenance; a version already on npm is
#   skipped, so re-running is safe. Authentication: the NPM_TOKEN secret.
# - Pull requests: everything up to `npm publish --dry-run`.
name: Publish quickertype-core

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE: quickertype-core

jobs:
  publish-npm-core:
    name: ${{ github.event_name == 'pull_request' && 'quickertype-core (dry run)' || 'publish quickertype-core' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: npm/quicktype-core
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.114
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: The package's version is the workspace version (and the tag's)
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          workspace=$(cargo metadata --format-version 1 --no-deps | jq -r '[.packages[] | select(.name == "quickertype")][0].version')
          echo "$name $version (workspace $workspace)"
          if [ "$name" != "$PACKAGE" ]; then
            echo "::error::package.json names $name, not $PACKAGE."
            exit 1
          fi
          if [ "$version" != "$workspace" ]; then
            echo "::error::npm/quicktype-core/package.json is at $version, not the workspace version $workspace."
            exit 1
          fi
          if [ -n "$PLAN" ]; then
            tag=$(jq -r .announcement_tag <<<"$PLAN")
            if [ "$tag" != "v$version" ]; then
              echo "::error::The release tag is $tag but the package is at $version."
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package contents (npm pack --dry-run)
        run: npm pack --dry-run
      - name: Dry run (npm publish --dry-run)
        if: github.event_name == 'pull_request'
        run: npm publish --dry-run --access public
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
            echo "$PACKAGE $VERSION is already on npm; skipping."
            exit 0
          fi
          tag=latest
          if [[ $VERSION == *-* ]]; then tag=next; fi
          npm publish --access public --provenance --tag "$tag"
