[workspace]
members = ["cargo:."]

# Config for 'dist' (https://axodotdev.github.io/cargo-dist/book/), which
# generates .github/workflows/release.yml: never edit that file by hand,
# change this file and run `dist generate` (CI checks with
# `dist generate --check`). See docs/RELEASING.md.
#
# dist builds the `quickertype` CLI (crates/quicktype-cli); every other
# workspace member sets `dist = false` in its [package.metadata.dist].
# Package-specific settings (formula and npm package names) are in
# crates/quicktype-cli/Cargo.toml.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to (needs the HOMEBREW_TAP_TOKEN secret)
tap = "EloB/homebrew-tap"
# Publish jobs to run in CI after the GitHub Release is created: the
# Homebrew formula (HOMEBREW_TAP_TOKEN), the `quickertype` npm installer
# (NPM_TOKEN), the crates on crates.io (.github/workflows/publish-crates.yml)
# and the `quickertype-core` npm package (.github/workflows/publish-npm-core.yml)
publish-jobs = ["homebrew", "npm", "./publish-crates", "./publish-npm-core"]
# The custom publish jobs check the repository out and get an OIDC token
# (crates.io trusted publishing, npm provenance)
github-custom-job-permissions = { "publish-crates" = { contents = "read", id-token = "write" }, "publish-npm-core" = { contents = "read", id-token = "write" } }
# On pull requests, only run `dist plan` (CI's `dist` job does too): the
# six targets and the MSI take about 13 minutes. For a full release build
# without releasing, a branch can set "upload" and run `dist generate`
# (docs/RELEASING.md, "Dry runs").
pr-run-mode = "plan"
# Build with `cargo build --package quickertype` instead of `--workspace`:
# the same build as `cargo build --release -p quickertype` (no WASM
# bindings or xtask, no features unified from other members)
precise-builds = true
# Files to copy into the archives and installers besides the auto-included
# README.md, LICENSE and CHANGELOG.md (paths relative to the workspace root).
# release/typescript becomes the archives' `typescript` directory: the
# TypeScript compiler for the archive's target, the npm platform package,
# unmodified (with its LICENSE and NOTICE.txt), beside pins.json, which pins
# it. The build setup below stages the package there before `dist build`
# (locally, run `node release/bundle-typescript.mjs <target>` first).
# quickertype finds it next to its executable, where the archives, the MSI
# and the npm package (which unpacks the archive) put it, or in
# share/quickertype, where the Homebrew formula does; the shell and
# PowerShell installers install the binary only. dist copies `include` into
# the npm installer package too, where it is pins.json alone: the global
# build job has no build setup.
include = ["NOTICE", "release/typescript"]
# Steps release.yml runs in each build-local-artifacts job before
# `dist build` (path relative to .github/workflows): they stage the
# TypeScript compiler for the job's target, verified against its pins.
github-build-setup = "../build-setup.yml"
# crates/quicktype-cli/wix/main.wxs is dist's rendering plus one line, the
# reference to the TypeScript compiler's components (the WiX fragment
# wix/typescript.wxs that release/bundle-typescript.mjs writes for a Windows
# target), so `dist generate` leaves it alone. CI's `dist` job checks that
# the rest is still what dist renders.
allow-dirty = ["msi"]
