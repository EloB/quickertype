<svg xmlns="http://www.w3.org/2000/svg" width="520" height="430" viewBox="0 0 520 430" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="title">How many times faster quickertype's CLI is</title>
<desc id="desc">Against quicktype's CLI on the same inputs; wall time. Startup (--version): 96× faster (quicktype 217 ms, quickertype 2.3 ms); pokedex.json (82 KB) → TypeScript: 60× faster (quicktype 257 ms, quickertype 4.3 ms); github-events.json (82 KB) → 8 languages: 35–50× faster (quicktype 271–289 ms, quickertype 5.6–8.2 ms); GraphQL schema (1.2 MB) and query → TypeScript: 28× faster (quicktype 245 ms, quickertype 8.9 ms); JSON Schema (vega-lite, 306 KB) → TypeScript: 11× faster (quicktype 418 ms, quickertype 36 ms); Generated JSON (40 MB) → TypeScript: 15× faster (quicktype 2,621 ms, quickertype 179 ms); quicktype's test corpus: 11,178 CLI runs, 12 in parallel: 46× faster (quicktype 572 s, quickertype 12.5 s).</desc>
<rect x="0.5" y="0.5" width="519" height="429" rx="10" fill="#1a1c23" stroke="#2d303a"/>
<text x="20" y="35" font-size="15" font-weight="600" fill="#e5e6ec">How many times faster quickertype's CLI is</text>
<text x="20" y="53.5" font-size="12.5" fill="#9a9dab">Against quicktype's CLI on the same inputs; wall time</text>
<text x="20" y="85.5" font-size="13.5" fill="#e5e6ec">Startup (<tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">--version</tspan>)</text>
<path d="M20 92.5H434.05A4 4 0 0 1 438.05 96.5V100.5A4 4 0 0 1 434.05 104.5H20Z" fill="#9085e9"/>
<text x="445.05" y="103.23" font-size="13.5" font-weight="600" fill="#e5e6ec">96×</text>
<text x="20" y="136" font-size="13.5" fill="#e5e6ec"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">pokedex.json</tspan> (82 KB) → TypeScript</text>
<path d="M20 143H277.28A4 4 0 0 1 281.28 147V151A4 4 0 0 1 277.28 155H20Z" fill="#9085e9"/>
<text x="288.28" y="153.73" font-size="13.5" font-weight="600" fill="#e5e6ec">60×</text>
<text x="20" y="186.5" font-size="13.5" fill="#e5e6ec"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">github-events.json</tspan> (82 KB) → 8 languages</text>
<rect x="20" y="193.5" width="151.41" height="12" fill="#9085e9"/>
<path d="M173.41 193.5H233.73A4 4 0 0 1 237.73 197.5V201.5A4 4 0 0 1 233.73 205.5H173.41Z" fill="#555186"/>
<text x="244.73" y="204.23" font-size="13.5" font-weight="600" fill="#e5e6ec">35–50×</text>
<text x="20" y="237" font-size="13.5" fill="#e5e6ec">GraphQL schema (1.2 MB) and query → TypeScript</text>
<path d="M20 244H137.93A4 4 0 0 1 141.93 248V252A4 4 0 0 1 137.93 256H20Z" fill="#9085e9"/>
<text x="148.93" y="254.73" font-size="13.5" font-weight="600" fill="#e5e6ec">28×</text>
<text x="20" y="287.5" font-size="13.5" fill="#e5e6ec">JSON Schema (vega-lite, 306 KB) → TypeScript</text>
<path d="M20 294.5H63.9A4 4 0 0 1 67.9 298.5V302.5A4 4 0 0 1 63.9 306.5H20Z" fill="#9085e9"/>
<text x="74.9" y="305.23" font-size="13.5" font-weight="600" fill="#e5e6ec">11×</text>
<text x="20" y="338" font-size="13.5" fill="#e5e6ec">Generated JSON (40 MB) → TypeScript</text>
<path d="M20 345H81.32A4 4 0 0 1 85.32 349V353A4 4 0 0 1 81.32 357H20Z" fill="#9085e9"/>
<text x="92.32" y="355.73" font-size="13.5" font-weight="600" fill="#e5e6ec">15×</text>
<text x="20" y="388.5" font-size="13.5" fill="#e5e6ec">quicktype's test corpus: 11,178 CLI runs, 12 in parallel</text>
<path d="M20 395.5H216.31A4 4 0 0 1 220.31 399.5V403.5A4 4 0 0 1 216.31 407.5H20Z" fill="#9085e9"/>
<text x="227.31" y="406.23" font-size="13.5" font-weight="600" fill="#e5e6ec">46×</text>
