[package]
name = "quickertype-js-compat"
description = "JavaScript-exact helpers (number formatting, UTF-16 strings, V8 sort, JSON.stringify, pluralize, ...) for the quicktype Rust port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["quicktype", "javascript", "json", "v8", "utf-16"]
categories = ["encoding", "value-formatting", "parser-implementations"]
include = ["/src/", "/build.rs", "/LICENSE", "/NOTICE"]

[package.metadata.dist]
# dist builds installers for the `quickertype` CLI only; this crate is
# published to crates.io by .github/workflows/publish-crates.yml.
dist = false

[lib]
name = "quicktype_js_compat"

[dependencies]
foldhash.workspace = true
indexmap.workspace = true
regex.workspace = true
# `dfa-search`: pluralize's rule selectors, which the build script makes.
regex-automata = { workspace = true, features = ["dfa-search"] }
ryu.workspace = true
saphyr-parser.workspace = true
stacker.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }

[features]
# On wasm32, compute `**` with the JavaScript host's `Math.pow` (exactly
# what the TypeScript quicktype computes there). Needs a JavaScript host
# with wasm-bindgen glue; see `number::pow`.
js-host-math = ["dep:wasm-bindgen"]
# On wasm32, seed every hash map and set (`hash`) from the JavaScript
# host's `crypto.getRandomValues`, as the `quicktype-wasm` bindings do.
# Needs a JavaScript host with wasm-bindgen glue, which must call
# `hash::init()` when it starts and handle its error. Without the feature,
# a wasm32 build seeds its maps from `std`'s `RandomState` (fixed on
# wasm32-unknown-unknown, which has no randomness of its own) unless the
# embedder calls `hash::seed` first. quickertype-core's `js-host-random`
# turns it on.
js-host-random = ["dep:wasm-bindgen"]
# Natively, hash every map and set (`hash`) with `std`'s SipHash-1-3,
# keyed from the operating system's random source, instead of foldhash
# with such a seed: a keyed pseudorandom function, for an embedder that
# hashes untrusted input on a server. Slower; the output is the same. No
# effect on wasm32, where `std`'s keys are fixed. quickertype-core's
# `siphash` turns it on.
siphash = []

[build-dependencies]
regex-automata = { workspace = true, features = ["dfa-build"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
