name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; one in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The site (site/, see docs/SITE.md): the landing page; the playground,
  # quicktype-core with the WebAssembly engine bundled for the browser; the
  # benchmarks page. Checked in headless Chrome against the CLI.
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the benchmarks page links the quickertype
      # commits its numbers were measured at, and the smoke test checks
      # they are commits of this repository.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.114
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The repository's npm workspace (package.json).
      - run: npm ci
      - run: npm run build -w quickertype-core
      # tests/golden, whose cases the landing page counts.
      - uses: ./.github/actions/golden
      - run: node site/build.mjs
      # The smoke test compares the page's output with the CLI's.
      - run: cargo build --release --package quickertype
      - run: node site/test/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
