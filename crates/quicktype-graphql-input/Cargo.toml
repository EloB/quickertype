[package]
name = "quickertype-graphql-input"
description = "GraphQL query + schema input for quicktype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["quicktype", "graphql", "codegen", "types"]
categories = ["development-tools", "parser-implementations"]
include = ["/src/", "/LICENSE", "/NOTICE"]

[package.metadata.dist]
# dist builds installers for the `quickertype` CLI only; this crate is
# published to crates.io by .github/workflows/publish-crates.yml.
dist = false

[lib]
name = "quicktype_graphql_input"

[dependencies]
indexmap.workspace = true
quickertype-core.workspace = true
quickertype-js-compat.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
