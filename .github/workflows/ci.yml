name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The `trace` feature (docs/BENCHMARKS.md), off in every other build:
      # its spans, `__trace` and the `phases` example.
      - run: cargo clippy -p quickertype-core -p quicktype-wasm --all-targets --features quickertype-core/trace,quicktype-wasm/trace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p quickertype-core -p quicktype-wasm --lib --features quickertype-core/trace,quicktype-wasm/trace

  # The CLI and the tests on the other platforms the release builds for
  # (docs/RELEASING.md). The parity corpus runs on Linux only (`parity`).
  # The CLI's integration tests build the binary themselves
  # (`CARGO_BIN_EXE_quicktype`).
  test-platforms:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  # .github/workflows/release.yml and crates/quicktype-cli/wix/main.wxs are
  # generated by dist from dist-workspace.toml: fail if they are out of date
  # (run `dist generate`). Uses the dist version the config pins.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Install dist
        shell: bash
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          test -n "$version"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - run: dist generate --check
      - run: dist plan

  # Byte-for-byte parity with the TypeScript quicktype. Fails only if a case
  # listed in tests/parity-baseline.txt regresses.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask parity --report parity-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: parity-report.json

  # TypeScript input against what quicktype-typescript-input (TypeScript
  # 5.9) recorded. Needs the TypeScript 7.0.2 native compiler; without it
  # the test would skip itself, so the version is checked first.
  typescript-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the TypeScript 7.0.2 compiler
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/tsc" typescript@7.0.2
          tsc="$RUNNER_TEMP/tsc/node_modules/@typescript/typescript-linux-x64/lib/tsc"
          "$tsc" --version
          "$tsc" --version | grep -q "7\.0\.2"
          echo "QUICKTYPE_TSC=$tsc" >> "$GITHUB_ENV"
      - run: cargo test -p quickertype-typescript-input --test differential

  # Secrets in the whole history (configuration: .gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package quicktype-wasm --target wasm32-unknown-unknown --release
      - run: cargo build --package quicktype-wasm --target wasm32-unknown-unknown --release --features trace
      # Every target of the engine's crate (its tests and the `phases`
      # example too) as WebAssembly, with and without `trace`.
      - run: cargo clippy --package quicktype-wasm --target wasm32-unknown-unknown --all-targets
      - run: cargo clippy --package quicktype-wasm --target wasm32-unknown-unknown --all-targets --features trace

  # npm/quicktype-core: the WebAssembly engine behind quicktype's own
  # TypeScript API. Without a quicktype checkout, the differential suite
  # compares the engine with the package's own (vendored, unmodified)
  # TypeScript engine.
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm/quicktype-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.114
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/quicktype-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:differential -- --report differential-report.json
        env:
          QUICKTYPE_REFERENCE: self
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-report
          path: npm/quicktype-core/differential-report.json

